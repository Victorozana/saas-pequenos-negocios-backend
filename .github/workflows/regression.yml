name: Backend regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__PostgreSqlMigration: Host=localhost;Database=postgres;Username=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE agendamento_app_user NOLOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT;
          CREATE ROLE agendamento_system_user NOLOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT;
          SQL
          git rev-parse HEAD
          dotnet test Agendamento.sln --nologo -v minimal
